<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Hillard Lights">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0f2a"/>
      <stop offset="1" stop-color="#0a0714"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#ff8a2a" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#a020f0" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0a0714" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <circle cx="256" cy="230" r="220" fill="url(#glow)"/>

  <g fill="#f5efe8">
    <!-- H -->
    <rect x="96"  y="152" width="42" height="208" rx="8"/>
    <rect x="200" y="152" width="42" height="208" rx="8"/>
    <rect x="96"  y="240" width="146" height="36" rx="6"/>
    <!-- L -->
    <rect x="292" y="152" width="42" height="208" rx="8"/>
    <rect x="292" y="324" width="128" height="36" rx="6"/>
  </g>

  <g fill="#ffb04a">
    <circle cx="128" cy="112" r="10"/>
    <circle cx="200" cy="96"  r="10"/>
    <circle cx="272" cy="112" r="10"/>
    <circle cx="344" cy="96"  r="10"/>
    <circle cx="416" cy="112" r="10"/>
  </g>
</svg>
